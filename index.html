<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua Latina vocabulary</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9ece6;
  --surface: #f7f8f4;
  --stone: #dde2da;
  --ink: #1e2a35;
  --muted: #5b6670;
  --line: #c6ccc3;
  --red: #9b2226;
  --red-soft: #f3dcdc;
  --green: #2c7a67;
  --green-soft: #d7ece5;
  --amber: #a86a12;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161c22; --surface: #1f2730; --stone: #28323c; --ink: #e6e9e3; --muted: #9aa5ad;
    --line: #36424d; --red: #e06666; --red-soft: #3a2326; --green: #5fb89f; --green-soft: #1d3530; --amber: #e0a84a;
  }
}
:root[data-theme="dark"] {
  --bg: #161c22; --surface: #1f2730; --stone: #28323c; --ink: #e6e9e3; --muted: #9aa5ad;
  --line: #36424d; --red: #e06666; --red-soft: #3a2326; --green: #5fb89f; --green-soft: #1d3530; --amber: #e0a84a;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1.125rem; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.wrap { max-width: 40rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

/* Home */
.masthead { padding: 1rem 0 1.75rem; border-bottom: 2px solid var(--ink); margin-bottom: 1.5rem; }
.masthead h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 9vw, 3.4rem);
  letter-spacing: 0.06em; line-height: 1.05; margin: 0;
}
.masthead p { margin: 0.5rem 0 0; color: var(--muted); }
.overall { margin-top: 1rem; font-size: 1rem; }
.overall strong { font-family: var(--display); font-size: 1.25rem; }

h2 { font-size: 1.05rem; font-weight: 700; margin: 1.75rem 0 0.6rem; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
.linkish { background: none; border: 0; padding: 0.25rem 0; color: var(--red); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.1rem, 1fr)); gap: 0.4rem; }
.ch {
  position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 3px;
  padding: 0.55rem 0.2rem 0.75rem; text-align: center; overflow: hidden;
}
.ch .num { font-family: var(--display); font-weight: 700; font-size: 1.05rem; display: block; line-height: 1.2; }
.ch .cnt { font-size: 0.78rem; color: var(--muted); display: block; }
.ch .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--green); }
.ch[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }

.seg { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.seg button {
  flex: 1 1 auto; background: var(--surface); border: 1.5px solid var(--line); border-radius: 3px;
  padding: 0.55rem 0.8rem; font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hint { font-size: 0.95rem; color: var(--muted); margin: 0.4rem 0 0; }

.primary {
  display: block; width: 100%; margin-top: 2rem; padding: 1rem;
  background: var(--red); color: #fff; border: 0; border-radius: 3px;
  font-weight: 700; font-size: 1.2rem;
}
.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.secondary {
  display: block; width: 100%; margin-top: 0.6rem; padding: 0.85rem;
  background: transparent; border: 1.5px solid var(--ink); border-radius: 3px; font-weight: 700;
}
.foot { margin-top: 2.5rem; font-size: 0.9rem; color: var(--muted); }

/* Session */
.topbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
.topbar .linkish { color: var(--muted); }
.progress { flex: 1; height: 6px; background: var(--stone); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); transition: width 0.25s; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 1rem; }

.tablet {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px;
  padding: 1.5rem 1.25rem 1.75rem; min-height: 12rem;
  display: flex; flex-direction: column; justify-content: center; text-align: center;
}
.tablet.clickable { cursor: pointer; }
.cap { font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.9rem; }
.latin {
  font-family: var(--display); font-weight: 700; letter-spacing: 0.03em;
  font-size: clamp(1.5rem, 6.5vw, 2.3rem); line-height: 1.25; overflow-wrap: anywhere;
}
.latin .rest { display: block; font-weight: 500; font-size: 0.55em; color: var(--muted); letter-spacing: 0.02em; margin-top: 0.3rem; }
.english { font-size: clamp(1.4rem, 5.5vw, 1.9rem); font-weight: 500; line-height: 1.3; }
.ask { color: var(--muted); font-size: 1rem; margin-top: 1rem; }

.reveal { margin-top: 1.25rem; padding-top: 1.1rem; border-top: 1px solid var(--line); text-align: left; }
.reveal .latin { font-size: 1.35rem; }
.reveal .english { font-size: 1.2rem; margin-top: 0.2rem; }
.deriv { font-size: 0.98rem; color: var(--muted); margin-top: 0.6rem; }
.deriv em { color: var(--ink); font-style: italic; }

.verdict { font-weight: 700; margin-bottom: 0.5rem; }
.verdict.good { color: var(--green); }
.verdict.bad { color: var(--red); }
.verdict.close { color: var(--amber); }

.options { display: grid; gap: 0.5rem; margin-top: 1rem; }
.opt {
  display: flex; gap: 0.75rem; align-items: baseline; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 3px; padding: 0.8rem 0.9rem;
}
.opt .k { font-size: 0.85rem; color: var(--muted); min-width: 1rem; }
.opt.lat { font-family: var(--display); font-weight: 700; letter-spacing: 0.02em; }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt:disabled { cursor: default; color: inherit; }

.answer-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
.answer-row input {
  flex: 1; min-width: 0; padding: 0.8rem 0.9rem; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 3px; font-size: 1.15rem;
}
.answer-row input:focus { border-color: var(--ink); outline: none; }
.answer-row button { padding: 0.8rem 1.1rem; border: 0; border-radius: 3px; background: var(--ink); color: var(--bg); font-weight: 700; }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; }
.pair button { padding: 0.95rem; border-radius: 3px; font-weight: 700; border: 1.5px solid; background: var(--surface); }
.pair .yes { border-color: var(--green); color: var(--green); }
.pair .no { border-color: var(--red); color: var(--red); }
.next { margin-top: 1rem; }
.next .primary { margin-top: 0; }

/* Results */
.score { font-family: var(--display); font-weight: 700; font-size: clamp(3rem, 16vw, 5rem); line-height: 1; margin: 0.5rem 0; }
.missed { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.missed li { padding: 0.65rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; }
.missed .l { font-family: var(--display); font-weight: 700; }
.missed .e { color: var(--muted); text-align: right; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

const WORDS = [];
const CHAPTERS = [];
(function parse() {
  let ch = 0;
  RAW.split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.startsWith('#')) { ch = parseInt(line.slice(1), 10); CHAPTERS.push(ch); return; }
    const [la, en, de] = line.split('|');
    const n = WORDS.filter(w => w.ch === ch).length;
    WORDS.push({ id: ch + ':' + n, ch, la, en, de: (de || '').trim() });

const ROMAN = n => {
  const m = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s;
};

/* ---------- storage ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

let stats = load(STORE_KEY, {});            // id -> [right, wrong, last]
let prefs = load(STORE_KEY + '-prefs', { chapters: [1], dir: 'la', mode: 'flash', len: 20 });

function record(w, ok) {
  const s = stats[w.id] || [0, 0, 0];
  if (ok) s[0]++; else s[1]++;
  s[2] = ok ? 1 : 0;
  stats[w.id] = s; save(STORE_KEY, stats);
}
const isKnown = w => stats[w.id] && stats[w.id][2] === 1;
const isTricky = w => stats[w.id] && stats[w.id][2] === 0;

/* ---------- answer checking ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function normEn(s) {
  return s.toLowerCase()
    .replace(/\(.*?\)/g, ' ')
    .replace(/[!?.'"]/g, '')
    .replace(/^(he|she|it|they)\s+/, '')
    .replace(/^(to|a|an|the)\s+/, '')
    .replace(/our\b/g, 'or').replace(/is(e|ed|es|ing)\b/g, 'iz$1')
    .replace(/\s+/g, ' ').trim();
}
function enAlts(en) {
  const s = en.toLowerCase().replace(/\(.*?\)/g, ' ').replace(/he, she, (or )?it /g, '');
  return s.split(/[;,/]/).map(normEn).filter(Boolean);
}
function normLa(s) {
  return s.toLowerCase().replace(/j/g, 'i').replace(/[^a-z\s-]/g, ' ').replace(/\s+/g, ' ').trim();
}
function laAlts(la) {
  const out = new Set();
  la.split('/').forEach(part => {
    part.split(',').forEach((bit, k) => {
      const b = normLa(bit);
      // headword always; other principal parts / forms if they look like real words
      if (k === 0 ? b : (b.length >= 4 && !/\./.test(bit) && !/^-/.test(bit.trim()))) out.add(b);
    });
  });
  out.add(normLa(la));
  return [...out];
}
function lev(a, b) {
  if (a === b) return 0;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// returns 'exact' | 'close' | false
function matchAny(input, alts, closeLen) {
  if (!input) return false;
  if (alts.includes(input)) return 'exact';
  for (const a of alts) {
    const tol = a.length >= 9 ? 2 : a.length >= closeLen ? 1 : 0;
    if (tol && lev(input, a) <= tol) return 'close';
  }
  return false;
}
function sharesMeaning(a, b) {
  const x = enAlts(a.en), y = enAlts(b.en);
  return x.some(v => y.includes(v));
}
function checkTyped(card, raw) {
  const w = card.w;
  if (card.dir === 'la') {
    return matchAny(normEn(raw), enAlts(w.en), 5);
  }
  // English -> Latin: accept any Latin word that shares a meaning (synonyms)
  const input = normLa(raw);
  let best = matchAny(input, laAlts(w.la), 6);
  if (best === 'exact') return best;
  for (const o of WORDS) {
    if (o !== w && sharesMeaning(o, w)) {
      const m = matchAny(input, laAlts(o.la), 6);
      if (m === 'exact') return 'exact';
      if (m && !best) best = m;
    }
  }
  return best;
}

/* ---------- helpers ---------- */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isVerbish = w => /^to /.test(w.en) || /, -?[a-z]*(are|ere|ire)\b/.test(w.la)
  || (/^[a-z]+(at|et|it|unt|ant|ent)$/.test(w.la) && /s$/.test(w.en.split(';')[0].trim()));
function latinHTML(la) {
  const i = la.indexOf(',');
  if (i < 0) return esc(la);
  return esc(la.slice(0, i)) + '<span class="rest">' + esc(la.slice(i + 1).trim()) + '</span>';
}
function derivHTML(w) {
  return w.de ? `<div class="deriv">English words from it: <em>${esc(w.de)}</em></div>` : '';
}

/* ---------- state ---------- */
const app = document.getElementById('app');
let S = null; // session

function pool() { return WORDS.filter(w => prefs.chapters.includes(w.ch)); }

function buildDeck(words, len) {
  const tricky = shuffle(words.filter(isTricky));
  const fresh = shuffle(words.filter(w => !stats[w.id]));
  const known = shuffle(words.filter(isKnown));
  const ordered = [...tricky, ...fresh, ...known];
  return shuffle(len === 'all' ? ordered : ordered.slice(0, len));
}

function startSession(words) {
  if (!words.length) return;
  const deck = words.map(w => ({ w, dir: prefs.dir === 'mix' ? (Math.random() < 0.5 ? 'la' : 'en') : prefs.dir }));
  S = { deck, i: 0, right: 0, missed: [], phase: 'ask', result: null, typed: '', options: null, picked: null, pool: pool() };
  renderCard();
}

/* ---------- card ---------- */
function makeOptions(card) {
  const w = card.w;
  const base = S.pool.length >= 8 ? S.pool : WORDS;
  const valid = x => x !== w && !sharesMeaning(x, w) && x.la !== w.la;
  let cands = shuffle(base.filter(x => valid(x) && isVerbish(x) === isVerbish(w)));
  if (cands.length < 3) cands = shuffle(WORDS.filter(valid));
  const picked = [];
  for (const c of cands) {
    if (picked.length === 3) break;
    const label = card.dir === 'la' ? c.en : c.la;
    if (!picked.some(p => (card.dir === 'la' ? p.en : p.la) === label)) picked.push(c);
  }
  return shuffle([w, ...picked]);
}

function renderCard() {

  const w = card.w;
  const n = S.deck.length;
  const mode = prefs.mode;
  if (mode === 'choose' && !S.options) S.options = makeOptions(card);

  const prompt = card.dir === 'la'
    ? `<div class="latin">${latinHTML(w.la)}</div>`
    : `<div class="english">${esc(w.en)}</div>`;
  const askLine = {
    flash: card.dir === 'la' ? 'What does it mean?' : 'What is the Latin?',
    choose: card.dir === 'la' ? 'Choose the meaning' : 'Choose the Latin',
    type: card.dir === 'la' ? 'Type the meaning' : 'Type the Latin'
  }[mode];

  const answered = S.phase === 'done';
  const revealBlock = `
    <div class="reveal">
      ${S.result ? `<div class="verdict ${S.result}">${
        S.result === 'good' ? 'Correct' : S.result === 'close' ? 'Nearly: check the spelling' : 'Not quite'}</div>` : ''}
      ${card.dir === 'la'
        ? `<div class="english">${esc(w.en)}</div>`
        : `<div class="latin">${latinHTML(w.la)}</div>`}
      ${derivHTML(w)}
    </div>`;

  let body = '';
  if (mode === 'flash') {
    body = `
      <div class="tablet ${S.phase === 'ask' ? 'clickable' : ''}" data-act="flip">
        <div class="cap">Capitulum ${ROMAN(w.ch)}</div>
        ${prompt}
        ${S.phase === 'ask' ? `<div class="ask">${askLine}</div>` : revealBlock}
      </div>
      ${S.phase === 'ask'
        ? `<div class="next"><button class="primary" data-act="show">Show answer</button></div>`
        : S.phase === 'judge'
          ? `<div class="pair"><button class="yes" data-act="knew">I knew it</button><button class="no" data-act="didnt">Not yet</button></div>`
          : ''}`;
  } else if (mode === 'choose') {
    body = `
      <div class="tablet">
        <div class="cap">Capitulum ${ROMAN(w.ch)}</div>
        ${prompt}
        <div class="ask">${askLine}</div>
        ${answered ? revealBlock : ''}
      </div>
      <div class="options">
        ${S.options.map((o, idx) => {
          let cls = 'opt' + (card.dir === 'en' ? ' lat' : '');
          if (answered && o === w) cls += ' correct';
          if (answered && S.picked === o && o !== w) cls += ' wrong';
          const label = card.dir === 'la' ? o.en : o.la.split(',')[0];
          return `<button class="${cls}" data-opt="${idx}" ${answered ? 'disabled' : ''}><span class="k">${idx + 1}</span><span>${esc(label)}</span></button>`;
        }).join('')}
      </div>
      ${answered ? `<div class="next"><button class="primary" data-act="next">${S.i + 1 < n ? 'Next word' : 'See results'}</button></div>` : ''}`;
  } else {
    body = `
      <div class="tablet">
        <div class="cap">Capitulum ${ROMAN(w.ch)}</div>
        ${prompt}
        ${answered ? revealBlock : `<div class="ask">${askLine}</div>`}
      </div>
      ${answered
        ? `${S.result === 'bad' ? `<p class="hint">You wrote: <strong>${esc(S.typed || '(nothing)')}</strong>. <button class="linkish" data-act="override">I was right, count it</button></p>` : ''}
           <div class="next"><button class="primary" data-act="next">${S.i + 1 < n ? 'Next word' : 'See results'}</button></div>`
        : `<form class="answer-row" data-act="check" autocomplete="off">
             <label class="sr" for="ans">Your answer</label>
             <input id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${card.dir === 'la' ? 'meaning' : 'Latin word'}">
             <button type="submit">Check</button>
           </form>
           <p class="hint"><button class="linkish" data-act="giveup">Show me the answer</button></p>`}`;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="linkish" data-act="stop">Stop</button>
      <div class="progress" aria-hidden="true"><i style="width:${(S.i / n) * 100}%"></i></div>
      <span class="count">${S.i + 1} / ${n}</span>
    </div>
    ${body}`;

  // wiring
  const on = (sel, fn) => { const el = app.querySelector(sel); if (el) el.onclick = fn; };
  on('[data-act="stop"]', () => { if (S.i === 0 && S.phase === 'ask' || confirm('Stop this round? Answers so far are saved.')) renderResults(); });
  const reveal = () => { if (S.phase === 'ask') { S.phase = 'judge'; renderCard(); } };
  on('[data-act="show"]', reveal);
  on('[data-act="flip"]', reveal);
  on('[data-act="knew"]', () => answer(true));
  on('[data-act="didnt"]', () => answer(false));
  on('[data-act="next"]', advance);
  on('[data-act="giveup"]', () => { S.typed = ''; answer(false); });
  on('[data-act="override"]', () => {
    // undo the wrong mark and count it right
    const s = stats[w.id]; if (s && s[1] > 0) s[1]--;
    record(w, true);
    S.missed = S.missed.filter(x => x !== w); S.right++; S.result = 'good'; renderCard();
  });
  app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    if (S.phase === 'done') return;
    S.picked = S.options[+b.dataset.opt];
    answer(S.picked === w);
  });
  const form = app.querySelector('form[data-act="check"]');
  if (form) {
    const input = form.querySelector('input');
    setTimeout(() => input.focus(), 30);
    form.onsubmit = e => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) { input.focus(); return; }
      S.typed = val;
      const m = checkTyped(card, val);
      answer(!!m, m === 'close' ? 'close' : null);
    };
  }
  if (answered && mode !== 'flash') { const nb = app.querySelector('[data-act="next"]'); if (nb) nb.focus(); }
}

function answer(ok, flavour) {
  const w = S.deck[S.i].w;
  record(w, ok);
  if (ok) S.right++; else S.missed.push(w);
  S.result = ok ? (flavour || 'good') : 'bad';
  if (prefs.mode === 'flash') { advance(); return; }
  S.phase = 'done';
  renderCard();
}

function advance() {
  S.i++;
  S.phase = 'ask'; S.result = null; S.options = null; S.picked = null; S.typed = '';
  if (S.i >= S.deck.length) renderResults(); else renderCard();
}

/* ---------- results ---------- */
function renderResults() {
  const done = Math.min(S.i, S.deck.length);
  const missed = [...new Set(S.missed)];
  app.innerHTML = `
    <header class="masthead">
      <h1>Finis</h1>
      <div class="score">${S.right} / ${done}</div>
      <p>${done === 0 ? 'No words answered this round.'
        : S.right === done ? 'Every one right. Optime!'
        : S.right / done >= 0.8 ? 'Bene! Nearly all of them.'
        : 'Keep going: the missed words will come up first next time.'}</p>
    </header>
    ${missed.length ? `
      <h2>Words to look at again</h2>
      <ul class="missed">${missed.map(w => `<li><span class="l">${esc(w.la.split(',')[0])}</span><span class="e">${esc(w.en)}</span></li>`).join('')}</ul>
      <button class="primary" data-act="again">Practise these ${missed.length} again</button>` : ''}
    <button class="${missed.length ? 'secondary' : 'primary'}" data-act="home">Back to chapters</button>`;
  const again = app.querySelector('[data-act="again"]');
  if (again) again.onclick = () => startSession(shuffle(missed));
  app.querySelector('[data-act="home"]').onclick = renderHome;
  window.scrollTo(0, 0);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!S || S.i >= S.deck.length) return;
  if (e.target.tagName === 'INPUT') return;
  const mode = prefs.mode;
  if (mode === 'flash') {
    if (S.phase === 'ask' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); S.phase = 'judge'; renderCard(); }
    else if (S.phase === 'judge' && e.key === '1') answer(true);
    else if (S.phase === 'judge' && e.key === '2') answer(false);
  } else if (mode === 'choose' && S.phase !== 'done' && /^[1-4]$/.test(e.key)) {
    const o = S.options[+e.key - 1]; if (o) { S.picked = o; answer(o === S.deck[S.i].w); }
  }
});

renderHome();
</script>
</body>
</html>
